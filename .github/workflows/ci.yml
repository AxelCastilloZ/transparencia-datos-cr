name: CI & DevSecOps Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar Linters
        run: |
          pnpm --dir backend lint
          pnpm --dir frontend lint

      - name: Ejecutar Pruebas Unitarias Backend
        run: pnpm --dir backend test

      - name: Ejecutar Pruebas Unitarias Frontend
        run: pnpm --dir frontend test --maxWorkers=1

      - name: Compilar Frontend y Backend
        run: pnpm build

  security-sast:
    name: Análisis SAST & Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de Secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Escaneo SAST con Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci

  security-sca:
    name: Análisis SCA (Dependencias)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar SBOM (CycloneDX)
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file sbom-backend.json --package-lock-only backend/
          npx @cyclonedx/cyclonedx-npm --output-file sbom-frontend.json --package-lock-only frontend/

      - name: Subir SBOM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.json

      - name: Escaneo de dependencias con OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --format=table

  container-scan:
    name: Build & Scan Contenedores
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: transparencia-cr-backend:ci

      - name: Build imagen frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: transparencia-cr-frontend:ci

      - name: Escaneo Trivy — backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: transparencia-cr-backend:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Escaneo Trivy — frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: transparencia-cr-frontend:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
