schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: Transparencia Datos CR — Radar cantonal de señales públicas.
  Stack: NestJS + TypeORM + PostgreSQL (backend), React + Vite + Tailwind (frontend).
  Monorepo con pnpm workspaces (backend/, frontend/).
  TypeORM usa synchronize:true — NO crear migraciones manuales.
  El módulo TSE NUNCA debe persistir datos personales (cédula, nombre).
  SICOP DEBE separar montos por moneda (CRC/USD), nunca sumar mixto.
  Fecha límite proyecto DevSecOps: 13 de noviembre de 2026.

rules:
  proposal:
    - Mantener propuestas bajo 500 palabras
    - Incluir siempre sección "No-objetivos"
  tasks:
    - Dividir tareas en bloques de máximo 2 horas
    - Cada tarea debe ser verificable con un screenshot o test

operations:
  apply:
    guidance:
      - Correr pnpm test después de cada cambio
      - No commitear sin que Gitleaks pase (pre-commit hook)
  archive:
    guidance:
      - Resumir el resultado del archive antes de cerrar
